[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ssm-param-drift"
version = "0.2.0"
description = "Diff a YAML baseline of SSM Parameter Store parameters against the live AWS account"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "ssm", "parameter-store", "drift", "audit", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0.3", "boto3>=1.43"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.17"]

[project.scripts]
aws-ssm-param-drift = "aws_ssm_param_drift.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-ssm-param-drift"
Source = "https://github.com/moveeeax/aws-ssm-param-drift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
